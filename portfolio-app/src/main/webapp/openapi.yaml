openapi: 3.0.3
info:
  title: Atlas Portfolio API
  version: 1.0.0
  description: 'Java MVC2 + jCompany Community 1.2 adaptado. Basic Auth do Tomcat.
    GET: viewer/editor. Escritas: editor. Erros do contêiner anteriores ao JAX-RS
    podem ser HTML.'
servers:
- url: http://localhost:8080/portfolio/api
security:
- basicAuth: []
paths:
  /projects:
    get:
      summary: Listar projetos com paginação e filtros
      parameters:
      - name: name
        in: query
        schema:
          type: string
          maxLength: 160
      - name: status
        in: query
        schema:
          type: string
          enum:
          - EM_ANALISE
          - ANALISE_REALIZADA
          - ANALISE_APROVADA
          - INICIADO
          - PLANEJADO
          - EM_ANDAMENTO
          - ENCERRADO
          - CANCELADO
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 1000000
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
        '400':
          description: JSON ou parâmetros inválidos
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Autenticação obrigatória
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Perfil sem permissão
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Projeto inexistente
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Conflito de regra ou versão
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Dados inválidos
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          description: Versão obrigatória
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Diretório externo indisponível
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      summary: Criar projeto em análise (editor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '201':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: JSON ou parâmetros inválidos
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Autenticação obrigatória
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Perfil sem permissão
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Projeto inexistente
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Conflito de regra ou versão
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Dados inválidos
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          description: Versão obrigatória
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Diretório externo indisponível
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /projects/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    get:
      summary: Obter projeto e ETag de versão
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: JSON ou parâmetros inválidos
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Autenticação obrigatória
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Perfil sem permissão
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Projeto inexistente
          content:
            application/problem+json:
              schema:
