name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: portfolio_test
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: portfolio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U portfolio_test -d portfolio_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/portfolio_test
      TEST_POSTGRES_USER: portfolio_test
      TEST_POSTGRES_PASSWORD: disposable_ci_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: ./mvnw -B -ntp verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            portfolio-app/target/surefire-reports
            portfolio-app/target/site/jacoco
